<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Valentine 💝</title>

<script>
tailwind.config = {
  theme: { extend: { animation: { shake: 'shake 0.3s infinite' } } }
}
</script>

<style>
@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(-5px); }
  50% { transform: translate(5px); }
  75% { transform: translate(-5px); }
  100% { transform: translate(0); }
}
</style>
</head>

<body class="min-h-screen bg-pink-300 flex items-center justify-center text-white font-sans">

<!-- MUSIQUE -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- ÉCRAN CODE SECRET -->
<div id="lockScreen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-white rounded-3xl p-8 text-center shadow-2xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Code secret 💌</h2>
    <input id="codeInput" type="password" placeholder="••••"
      class="px-4 py-3 text-center text-xl text-gray-800 rounded-xl border-2 border-pink-300 mb-4 w-full">
    <button onclick="checkCode()"
      class="px-6 py-3 bg-pink-500 text-white rounded-xl font-bold hover:scale-105 transition">
      Entrer 💝
    </button>
    <p id="error" class="text-red-500 mt-3 hidden">Mauvais code 😈</p>
  </div>
</div>

<!-- PAGE VALENTINE (TON CODE) -->
<div id="valentinePage" class="hidden min-h-screen w-full flex flex-col justify-center items-center">

<h1 id="dynamicTitle" class="text-4xl md:text-6xl text-black font-bold mb-12 animate-pulse text-center">
<span id="nameDisplay"></span>, veux-tu être ma Valentine ? 🥹👉🏾👈🏾
</h1>

<button id="oui"
class="fixed px-8 py-5 text-xl font-bold bg-gradient-to-r from-pink-400 to-rose-400 rounded-full shadow-2xl">
Oui 😍
</button>

<button id="non"
class="fixed px-8 py-5 text-xl font-bold bg-gray-200 text-gray-800 rounded-full shadow-xl">
Non 🙄
</button>

<div id="success" class="fixed inset-0 bg-black/80 flex flex-col justify-center items-center hidden">
<img src="https://media.giphy.com/media/u8u0R51ND9L2/giphy.gif" class="w-72 mb-6">
<h2 class="text-4xl font-black text-pink-400 animate-pulse">Woooww Superrr 💘</h2>
</div>

</div>

<script>
const lockScreen = document.getElementById('lockScreen');
const page = document.getElementById('valentinePage');
const music = document.getElementById('music');
const error = document.getElementById('error');

function checkCode() {
  const code = document.getElementById('codeInput').value;
  if (code === '2501') {
    lockScreen.style.display = 'none';
    page.classList.remove('hidden');
    music.play();
    const name = prompt("Ton prénom 💕");
    document.getElementById('nameDisplay').textContent = name || '';
  } else {
    error.classList.remove('hidden');
    if (navigator.vibrate) navigator.vibrate(300);
  }
}

const oui = document.getElementById('oui');
const non = document.getElementById('non');
let scale = 1;

function moveNon() {
  non.style.left = Math.random() * (window.innerWidth - 150) + 'px';
  non.style.top = Math.random() * (window.innerHeight - 150) + 'px';
  non.classList.add('animate-shake');
  scale += 0.2;
  oui.style.transform = `scale(${scale})`;
}

non.addEventListener('mouseenter', moveNon);
non.addEventListener('click', moveNon);

oui.addEventListener('click', () => {
  document.querySelectorAll('button').forEach(b => b.style.display = 'none');
  document.getElementById('dynamicTitle').style.display = 'none';
  document.getElementById('success').classList.remove('hidden');
});
</script>

</body>
</html>
